<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Forum</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('https://images.unsplash.com/photo-1522337360788-8b13dee7a37e') center/cover no-repeat fixed;
            position: relative;
        }
        .page::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }
        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem 3rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.75rem;
            color: #2c2c2c;
            text-align: center;
            margin-bottom: 1.75rem;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            font-size: 0.875rem;
            color: #555;
            margin-bottom: 0.35rem;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.65rem 0.75rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #8b7355;
        }
        button[type="submit"] {
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.5rem;
            background: #8b7355;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 500;
        }
        button[type="submit"]:hover {
            background: #7a6449;
        }
        .error {
            color: #c00;
            font-size: 0.875rem;
            text-align: center;
            margin-top: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="card">
            <h1>Welcome to the Beauty Forum</h1>
            <form action="/login" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit">Login</button>
                <p id="error" class="error" style="display: none;">Invalid username or password.</p>
            </form>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('error') === '1') {
            document.getElementById('error').style.display = 'block';
        }
    </script>
</body>
</html>
